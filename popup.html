<!DOCTYPE html>
<html>
  <head>
    <title>IBAN Validator</title>
    <style>
      body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        padding: 16px; 
        width: 320px;
        margin: 0;
        background: #f8f9fa;
      }
      
      .container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      
      h3 { 
        margin: 0 0 16px 0; 
        color: #333;
        text-align: center;
      }
      
      #ibanInput { 
        width: 100%; 
        padding: 12px;
        margin-bottom: 12px; 
        border: 2px solid #e1e5e9;
        border-radius: 6px;
        font-size: 14px;
        font-family: 'Courier New', monospace;
        text-transform: uppercase;
        box-sizing: border-box;
      }
      
      #ibanInput:focus {
        outline: none;
        border-color: #007acc;
      }
      
      #validateBtn { 
        width: 100%; 
        padding: 12px;
        background: #007acc;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      
      #validateBtn:hover {
        background: #005a9e;
      }
      
      #result { 
        margin-top: 16px; 
        padding: 12px;
        border-radius: 6px;
        font-weight: 600;
        text-align: center;
        min-height: 20px;
      }
      
      .valid {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      
      .invalid {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      
      .warning {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeaa7;
      }
      
      .info {
        font-size: 12px;
        color: #666;
        text-align: center;
        margin-top: 12px;
      }
      
      .section-divider {
        border-top: 1px solid #e1e5e9;
        margin: 0px 0 16px 0;
      }
      
      .generator-section {
        margin-top: 20px;
      }
      
      .generator-title {
        font-size: 14px;
        font-weight: 600;
        color: #333;
        margin-bottom: 12px;
        text-align: center;
      }
      
      #countrySelect {
        width: 100%;
        padding: 10px;
        margin-bottom: 12px;
        border: 2px solid #e1e5e9;
        border-radius: 6px;
        font-size: 14px;
        background: white;
        box-sizing: border-box;
      }
      
      #countrySelect:focus {
        outline: none;
        border-color: #28a745;
      }
      
      #generateBtn {
        width: 100%;
        padding: 12px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      
      #generateBtn:hover {
        background: #218838;
      }
      
      #generatedIban {
        margin-top: 12px;
        padding: 12px;
        background: #e7f5e7;
        border: 1px solid #c3e6cb;
        border-radius: 6px;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        text-align: center;
        color: #155724;
        word-break: break-all;
        cursor: pointer;
        user-select: all;
        display: none;
      }
      
      #generatedIban:hover {
        background: #d4edda;
      }
      
      .copy-hint {
        font-size: 11px;
        color: #666;
        text-align: center;
        margin-top: 4px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>IBAN Validator</h3>
      <input id="ibanInput" type="text" placeholder="Enter IBAN (e.g., DE89370400440532013000)" maxlength="34" />
      <button id="validateBtn">Validate IBAN</button>
      <div id="result"></div>
      
      <div class="section-divider"></div>
      
      <div class="generator-section">
        <div class="generator-title">Generate Sample IBAN</div>
        <select id="countrySelect">
          <option value="">Select a country...</option>
        </select>
        <button id="generateBtn">Generate Sample IBAN</button>
        <div id="generatedIban"></div>
        <div class="copy-hint">Click to copy to clipboard</div>
      </div>
      
      <div class="info">Supports all EU and international IBANs</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
