<!DOCTYPE html>
<html>
  <head>
    <title>IBAN Validator</title>
    <style>
      body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        padding: 16px; 
        width: 300px;
        margin: 0;
        background: #f8f9fa;
      }
      
      .container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      
      h3 { 
        margin: 0 0 16px 0; 
        color: #333;
        text-align: center;
      }
      
      #ibanInput { 
        width: 100%; 
        padding: 12px;
        margin-bottom: 12px; 
        border: 2px solid #e1e5e9;
        border-radius: 6px;
        font-size: 14px;
        font-family: 'Courier New', monospace;
        text-transform: uppercase;
        box-sizing: border-box;
      }
      
      #ibanInput:focus {
        outline: none;
        border-color: #007acc;
      }
      
      #validateBtn { 
        width: 100%; 
        padding: 12px;
        background: #007acc;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      
      #validateBtn:hover {
        background: #005a9e;
      }
      
      #result { 
        margin-top: 16px; 
        padding: 12px;
        border-radius: 6px;
        font-weight: 600;
        text-align: center;
        min-height: 20px;
      }
      
      .valid {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      
      .invalid {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      
      .warning {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeaa7;
      }
      
      .info {
        font-size: 12px;
        color: #666;
        text-align: center;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>IBAN Validator</h3>
      <input id="ibanInput" type="text" placeholder="Enter IBAN (e.g., DE89370400440532013000)" maxlength="34" />
      <button id="validateBtn">Validate IBAN</button>
      <div id="result"></div>
      <div class="info">Supports all EU and international IBANs</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
