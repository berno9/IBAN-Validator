<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>IBAN Validator</title>
    <style>
      body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        padding: 16px; 
        width: 520px;
        margin: 0;
        background: #f8f9fa;
      }
      
      .container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      
      h3 { 
        margin: 0 0 16px 0; 
        color: #333;
        text-align: center;
      }
      
      #ibanInput { 
          width: 100%; 
          padding: 12px;
          margin-bottom: 12px; 
          border: 2px solid #e1e5e9;
          border-radius: 6px;
          font-size: 14px;
          font-family: 'Courier New', monospace;
          text-transform: uppercase;
          box-sizing: border-box;
          resize: vertical;
        }
      
      #ibanInput:focus {
        outline: none;
        border-color: #007acc;
      }

        #clearBtn {
          position: absolute;
          top: 8px;
          right: 24px;
          font-size: 20px;
          color: #aaa;
          cursor: pointer;
          display: none;
          line-height: 1;
          transition: color 0.2s;
        }

        #clearBtn:hover {
          color: #dc3545;
        }
      
      #validateBtn { 
        width: 100%; 
        padding: 12px;
        background: #007acc;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      
      #validateBtn:hover {
        background: #005a9e;
      }

    #scanBtn {
      padding: 12px 16px;
      background: #ffc107;
      color: #444;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #scanBtn:hover {
      background: #e0a800;
    }

    #scanStatus {
      font-size: 12px;
      color: #856404;
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      border-radius: 6px;
      padding: 8px 12px;
      margin-top: 8px;
      display: none;
    }
      
      #result { 
          border-radius: 6px;
          font-weight: 600;
          text-align: center;
        }

        #result:not(:empty) {
          margin-top: 16px;
          padding: 12px;
        }
      
      .valid {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      
      .invalid {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      
      .warning {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeaa7;
      }
      
      .info {
        font-size: 12px;
        color: #666;
        text-align: center;
        margin-top: 12px;
      }
      
      #ibanDetails {
        margin-top: 16px;
        padding: 16px;
        background: #f8f9fa;
        border-radius: 6px;
        border: 1px solid #e1e5e9;
      }
      
      .section-divider {
        border-top: 1px solid #e1e5e9;
        margin: 16px 0;
      }
      
      .generator-section {
        margin-top: 20px;
      }
      
      .generator-title {
        font-size: 14px;
        font-weight: 600;
        color: #333;
        margin-bottom: 12px;
        text-align: center;
      }
      
      #countrySelect {
        width: 100%;
        padding: 10px;
        margin-bottom: 12px;
        border: 2px solid #e1e5e9;
        border-radius: 6px;
        font-size: 14px;
        background: white;
        box-sizing: border-box;
      }
      
      #countrySelect:focus {
        outline: none;
        border-color: #28a745;
      }
      
      #generateBtn {
        width: 100%;
        padding: 12px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      
      #generateBtn:hover {
        background: #218838;
      }
      
      #generatedIban {
        margin-top: 12px;
        padding: 12px;
        background: #e7f5e7;
        border: 1px solid #c3e6cb;
        border-radius: 6px;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        text-align: center;
        color: #155724;
        word-break: break-all;
        cursor: pointer;
        user-select: all;
        display: none;
      }
      
      #generatedIban:hover {
        background: #d4edda;
      }
      
        .generator-controls {
          display: flex;
          gap: 8px;
          margin-bottom: 12px;
        }

        .generator-controls #countrySelect {
          flex: 1;
          margin-bottom: 0;
        }

        .generator-controls #generateCount {
          width: 70px;
          padding: 10px;
          border: 2px solid #e1e5e9;
          border-radius: 6px;
          font-size: 14px;
          box-sizing: border-box;
          flex-shrink: 0;
        }

        .generator-controls #generateCount:focus {
          outline: none;
          border-color: #28a745;
        }

        #generatedIbans {
          margin-top: 12px;
        }

        #result table, #generatedIbans table {
          width: 100%;
          border-collapse: collapse;
          font-size: 13px;
          margin-top: 8px;
        }

        #result th, #generatedIbans th {
          background: #f0f0f0;
          padding: 8px;
          text-align: left;
          font-weight: 600;
          border: 1px solid #e1e5e9;
        }

        #result td, #generatedIbans td {
          padding: 8px;
          border: 1px solid #e1e5e9;
          font-family: 'Courier New', monospace;
          word-break: break-all;
        }

        #result tr.valid td { background: #d4edda; color: #155724; }
        #result tr.invalid td { background: #f8d7da; color: #721c24; }

        #result td.iban-cell {
          max-width: 120px;
        }

        #result td {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          cursor: help;
        }

        #result table {
          table-layout: fixed;
        }

        #result td.iban-cell, #result th:nth-child(1) {
          width: 50px;
        }

        #result th:nth-child(2), #result td:nth-child(2) {
          width: 50px;
        }

        #result th:nth-child(3), #result td:nth-child(3) {
          width: 110px;
        }

        #result td {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        button.csv-btn {
          margin-top: 10px;
          width: 100%;
          padding: 10px;
          background: #e8f4fc;
          color: #007acc;
          border: 1px solid #b3d9f2;
          border-radius: 6px;
          font-size: 13px;
          font-weight: 600;
          cursor: pointer;
          transition: background 0.2s, border-color 0.2s;
        }

        button.csv-btn:hover {
          background: #cce8f6;
          border-color: #007acc;
        }

        #generatedIbans tr {
          cursor: pointer;
        }

        #generatedIbans tr:hover td {
          background: #d4edda;
        }

        #generatedIbans tr.copied td {
          background: #c3e6cb;
        }

        #copyHintText {
          flex: 1;
          text-align: center;
        }

        .copy-hint {
          font-size: 11px;
          color: #666;
          text-align: center;
          margin: 8px auto;
          display: none;
          width: 100%; /* in order to push the toggle to the right */
            }

        #copyAllBtn {
          cursor: pointer;
          color: #555;
          padding: 2px 4px;
          border-radius: 4px;
          transition: background 0.2s, color 0.2s;
        }

        #copyAllBtn:hover {
          background: #cce8f6;
          color: #007acc;
        }

    #toggleGenerated {
      margin-left: auto; /* in order to push the toggle to the right */
      cursor: pointer;
      color: #aaa;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #ddd;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
    }

    #toggleGenerated:hover {
        color: #28a745;
        background: #d4edda;
        border-color: #28a745;
    }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>IBAN Validator</h3>
        <div style="position: relative;">
          <textarea id="ibanInput" rows="5" placeholder="Enter one or more IBANs, one per line"></textarea>
          <span id="clearBtn">×</span>
        </div>
      <div style="display: flex; gap: 8px">
        <button id="validateBtn" style="flex: 1">Validate</button>
        <button id="scanBtn">Scan Page</button>
      </div>

      <div id="scanStatus"></div>
      <div id="result"></div>
      
      <div class="section-divider"></div>
      
      <div class="generator-section">
        <div class="generator-title">Generate Sample IBAN</div>
        <div class="generator-controls">
          <select id="countrySelect">
            <option value="">Select a country...</option>
          </select>
          <input type="number" id="generateCount" value="1" min="1" max="500" />
        </div>
        <button id="generateBtn">Generate</button>
        <div class="copy-hint" id="copyHint">
            <span id="copyHintText">
                Click a row to copy<span style="margin-left: 4px;">·</span><span id="copyAllBtn">📋 Copy all</span>
            </span>
            <span id="toggleGenerated">▾</span>
        </div>
        <div id="generatedIbans"></div>
      </div>
      
      <div class="info">Supports all EU and international IBANs</div>
    </div>
    <script src="iban-data.js"></script>
    <script src="iban-validate.js"></script>
    <script src="iban-generate.js"></script>
    <script src="utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
